interface:
  display_name: "Rust to Mojo Bindings"
  short_description: "Generate tested Rust bindings and Mojo libraries"
  default_prompt: "Use $bind-rust-to-mojo to bind <crate source> and expose <API> in an existing Pixi project or a new standalone Mojo library; resolve every semantic choice, then build and test it end to end."

policy:
  allow_implicit_invocation: true
